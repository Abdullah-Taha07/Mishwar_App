name: Build Mishwar Android APKs
on:
  push:
    branches:
      - fix/rider-apk-notifications-routing-20261118-150339
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and verify three APKs
        run: python3 android/scripts/build-sdk.py --sdk "$ANDROID_HOME" --key "$RUNNER_TEMP/mishwar-debug.keystore" --output "$RUNNER_TEMP/mishwar-apks"
      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: mishwar-android-debug-apks
          path: ${{ runner.temp }}/mishwar-apks/*.apk
          if-no-files-found: error
          retention-days: 7
