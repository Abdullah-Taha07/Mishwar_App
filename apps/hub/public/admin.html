<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#083344"><title>إدارة طلبات الكباتن | كابتن مشوار</title><link rel="icon" href="/icon.svg"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin.css"></head><body><header class="app-header"><a class="brand" href="/"><img src="/icon.svg" alt="">كابتن <b>مشوار</b><span>الإدارة</span></a><a class="back-app" href="/">العودة للتطبيق ←</a></header><main><div class="page-heading"><div><span class="eyebrow">كل كابتن، بداية مشوار جديد</span><h1>طلبات الانضمام</h1><p>راجع البيانات والمستندات، واتخذ قرار الانضمام من مكان واحد.</p></div><button type="button" class="secondary" id="refresh">تحديث الطلبات ↻</button></div><section id="stats" class="stats" aria-label="ملخص الطلبات"></section><section class="workspace"><form class="toolbar" id="search-form"><label class="search-field"><span>البحث عن طلب</span><input id="search" placeholder="اسم الكابتن، رقم الجوال أو رقم الطلب" autocomplete="off"></label><label class="filter-field"><span>حالة الطلب</span><select id="status"><option value="pending">بانتظار المراجعة</option><option value="active">مفعّل</option><option value="rejected">مرفوض</option><option value="all">كل الطلبات</option></select></label><button class="primary" type="submit">بحث</button></form><div id="list-message" role="status"></div><div id="applications" aria-live="polite"><p class="empty">جارٍ تحميل الطلبات…</p></div><div class="pagination"><button class="secondary" id="previous" hidden>السابق</button><span id="page-info"></span><button class="secondary" id="next" hidden>المزيد</button></div></section><p class="storage-note">البيانات محفوظة في قاعدة بيانات الخادم، والمستندات في مساحة ملفات خاصة. تفعيل الحساب يتم بعد موافقتك.</p></main><dialog id="application-dialog" aria-labelledby="detail-title"><div id="application-detail"></div></dialog><dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="confirm-actions"><button class="secondary" id="cancel-decision">رجوع للمراجعة</button><button class="primary" id="confirm-decision">تأكيد القرار</button></div></dialog><div id="toast" role="status"></div><script type="module" src="/admin-ui.js"></script></body></html>
