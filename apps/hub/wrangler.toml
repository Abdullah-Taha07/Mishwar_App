name = "mishwar-api"
main = "dist/server/index.js"
compatibility_date = "2026-11-11"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "mishwar-db"
database_id = "510eb1ef-8814-4313-95e8-b1386ef40f8e"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mishwar-storage"
[triggers]
crons = ["* * * * *"]

[vars]
CAPTAIN_ADMIN_EMAIL = "Abduuallah3@gmail.com"

[previews]
[previews.vars]
# Preview does not inherit production vars.
CAPTAIN_ADMIN_EMAIL = "Abduuallah3@gmail.com"
[[previews.d1_databases]]
binding = "DB"
database_name = "mishwar-db-staging"
database_id = "9f88415f-4e4c-4fe8-8f79-f19b51165263"
migrations_dir = "drizzle"

[[previews.r2_buckets]]
binding = "BUCKET"
bucket_name = "mishwar-storage-staging"
