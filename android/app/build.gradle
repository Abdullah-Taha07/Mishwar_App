plugins { id 'com.android.application' }
android { namespace 'com.abdallataha.mishwar'; compileSdk 36
defaultConfig { applicationId 'com.abdallataha.mishwar'; minSdk 24; targetSdk 36; versionCode 3; versionName '0.3.0' }
flavorDimensions 'role'
productFlavors {
rider { dimension 'role'; applicationIdSuffix '.rider'; resValue 'string','app_name','مشوار'; resValue 'string','launch_url','https://mishwar-rider.vercel.app/' }
captain { dimension 'role'; applicationIdSuffix '.captain'; resValue 'string','app_name','كابتن مشوار'; resValue 'string','launch_url','https://mishwar-captain.vercel.app/' }
admin { dimension 'role'; applicationIdSuffix '.admin'; resValue 'string','app_name','مشوار الإدارة'; resValue 'string','launch_url','https://mishwar-admin-gamma.vercel.app/' }
}
buildTypes { release { minifyEnabled false } }
}
// The guarded launcher uses Android platform APIs only; no browser-helper runtime dependency.
